[project]
name = "ontology-mcp"
version = "0.0.1"
description = "AI エージェントにオントロジーのコンテキストを提供する MCP サーバー"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "ontology-core",
    # 2.x で FastMCP が MCPServer に改称され、トランスポート設定が run() 側へ移った。
    "mcp>=2.1",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
ontology-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_mcp"]
