# ローカル開発用。Azure に接続せず Fuseki と PostgreSQL を立てる。
#
# Container Apps 上の構成をなるべく再現するため、init コンテナで TDB2 を
# 作り直してから Fuseki を起動する流れも同じ形にしてある(fuseki-init)。
#
#   docker compose up -d
#   curl -X POST http://localhost:3030/ds/sparql \
#     -H 'Content-Type: application/sparql-query' \
#     --data 'SELECT ?c WHERE { ?c a <http://www.w3.org/2002/07/owl#Class> }'

name: ontology-accelerator

services:
  # entrypoint.sh が起動時に正本(ローカルでは samples/)から TDB2 を作り直してから
  # Fuseki を起動する。Container Apps 上と同じ流れ。
  fuseki:
    build:
      context: ./containers/fuseki
    ports:
      # 別のプロジェクトで 3030 を使っている場合は FUSEKI_PORT で変更できる。
      - "${FUSEKI_PORT:-3030}:3030"
    environment:
      FUSEKI_ADMIN_USER: admin
      # ローカル専用の値。デプロイ時は Key Vault から注入する。
      FUSEKI_ADMIN_PASSWORD: localdev
      JAVA_OPTIONS: "-Xmx1g"
      # Blob の代わりにマウントした samples/ から読み込む。
      LOCAL_TTL_DIR: /samples
    volumes:
      - fuseki-data:/fuseki/databases
      - ./samples:/samples:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$$/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ontology
      POSTGRES_USER: ontology
      # ローカル専用の値。
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 正本 TTL の Blob エミュレータ。integration テスト(test_blob.py)が使う。
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      # 別のプロジェクトで 10000 を使っている場合は AZURITE_PORT で変更できる。
      - "${AZURITE_PORT:-10000}:10000"

  # 仮想グラフ (Ontop VKG)。**既定では起動しない**(`P3-01`、ADR-0046)。
  #
  #   docker compose --profile vkg up -d ontop
  #
  # **プロファイルに入れてある理由。** Ontop は JVM を 1 つ増やすので、
  # 仮想グラフを触らない日の `just up` を重くしたくない。加えて
  # **マッピングは名前空間ごとに違う**ので、ローカルの既定として
  # 1 つのマッピングを置くと「これが標準」と読まれてしまう。
  #
  # ここで渡しているのは `containers/ontop/testdata/` の題材である。
  # 自分のマッピングを試すときは `ONTOP_INPUT_DIR` を差し替える。
  # **スキーマは自分で作る必要がある**(`testdata/schema.sql`)。
  #
  # **`ONTOP_LAZY_INIT=true`(イメージの既定)なので、表が無くても起動する。**
  # 最初のクエリで 500 を返し、表が現れれば次のクエリで通る(実測)。
  ontop:
    profiles: ["vkg"]
    build:
      context: ./containers/ontop
    ports:
      - "${ONTOP_PORT:-8099}:8080"
    environment:
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/db.properties
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/ontology
      ONTOP_DB_USER: ontology
      # ローカル専用の値。**ここだけ環境変数で渡している。**
      #
      # デプロイ環境と `ontop-check.test.sh` は `ONTOP_DB_PASSWORD_FILE`
      # (ファイルで渡す)を使う — **プロパティファイルにも argv にも
      # 載らない**形である(不変条件6 と同じ向き)。ここでファイルを
      # 使わないのは、`localdev` と 1 行書いたファイルをリポジトリに
      # 置くことになり、**秘密を置かない約束と見分けがつかなくなる**ため。
      ONTOP_DB_PASSWORD: localdev
    volumes:
      - ${ONTOP_INPUT_DIR:-./containers/ontop/testdata}:/opt/ontop/input:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fuseki-data:
  postgres-data:
