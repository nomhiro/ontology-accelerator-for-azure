name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .env.example
      - apps/web/package.json
      - docker-compose.yml
      - justfile
      - packages/api/alembic/**
      - packages/api/pyproject.toml
      - packages/core/pyproject.toml
      - packages/mcp-server/pyproject.toml
      - pnpm-lock.yaml
      - pyproject.toml
      - scripts/init-local-storage.py
      - uv.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1"

      - name: Verify development tools
        run: |
          uv --version
          node --version | grep -Eq '^v22\.'
          pnpm --version | grep -Eq '^9\.'
          just --version
          java -version 2>&1 | grep -Eq 'version "21\.'
          jq --version

      - name: Install locked dependencies
        run: |
          uv sync --all-packages
          uv run python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          pnpm install --frozen-lockfile

      - name: Start local services
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          docker compose up -d --build postgres fuseki azurite

      - name: Wait for PostgreSQL query readiness
        run: |
          set -eu
          ready=false
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres \
              psql -q -U ontology -d ontology -c 'SELECT 1' >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::PostgreSQL did not complete SELECT 1 readiness"
            docker compose logs postgres >&2
            exit 1
          fi

      - name: Wait for Fuseki HTTP readiness
        run: |
          set -eu
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent 'http://localhost:3030/$/ping' >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Fuseki did not respond successfully at /$/ping"
            docker compose logs fuseki >&2
            exit 1
          fi

      - name: Initialize local development services
        run: |
          docker compose exec -T postgres psql -q -v ON_ERROR_STOP=1 \
            -U ontology -d ontology \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          uv run python scripts/init-local-storage.py

      - name: Apply database migrations
        run: just migrate

      - name: Generate API types
        run: just gen-api

      - name: Verify initialized services
        run: |
          set -eu
          docker compose exec -T postgres psql -q -v ON_ERROR_STOP=1 \
            -U ontology -d ontology \
            -c 'SELECT 1'
          extensions=$(docker compose exec -T postgres psql -qAt \
            -U ontology -d ontology \
            -c "SELECT count(*) = 2 FROM pg_extension WHERE extname IN ('vector', 'pg_trgm')")
          if [ "$extensions" != "t" ]; then
            echo "::error::PostgreSQL is missing vector or pg_trgm"
            exit 1
          fi
          migration=$(docker compose exec -T postgres psql -qAt \
            -U ontology -d ontology \
            -c 'SELECT count(*) > 0 FROM alembic_version')
          if [ "$migration" != "t" ]; then
            echo "::error::No Alembic migration was recorded"
            exit 1
          fi
          curl --fail --silent --show-error 'http://localhost:3030/$/ping'
