name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# **main では打ち消さない**(P2A-12)。
#
# `cancel-in-progress: true` を無条件に置くと、**コードを検証中の run を
# ドキュメントだけの push が打ち消す**。新しい run は paths-filter で
# コードのジョブを全部スキップして `success` で終わるため、
# **「最新のコミットは緑」なのにコードは一度も検証されていない**状態が
# できる(2026-09-10 に実際に発生し、手動で再実行して検証した)。
#
# PR のブランチでは最新のコミットだけが問題なので打ち消してよい。
# main は 1 コミットずつ検証されるべきなので打ち消さない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 変更されたパスに応じて後続のジョブを絞る。
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      containers: ${{ steps.filter.outputs.containers }}
      shell: ${{ steps.filter.outputs.shell }}
      reasoner: ${{ steps.filter.outputs.reasoner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              # packages/api/tests/test_isolation.py が実物の Fuseki に対して
              # containers/fuseki/config.ttl の SERVICE 無効化(arq:httpServiceAllowed)
              # を検証している。containers/ 側だけの変更(config.ttl から誤って
              # SERVICE 無効化を外す等)でも python ジョブ(テスト実行)が動くようにする。
              # `containers` フィルタと同じパスが重複するのは意図した重複で、
              # python はテスト実行のため、containers はイメージビルドのために
              # それぞれ別の理由で反応する。
              - 'containers/**'
            web:
              - 'apps/web/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'azure.yaml'
              - '.github/workflows/ci.yml'
            containers:
              - 'containers/**'
              - 'packages/*/Dockerfile'
              - '.github/workflows/ci.yml'
            # シェルスクリプトの検査。**`scripts/**` を含める。**
            # 以前は `shell` ジョブが `containers` フィルタで動いていたため、
            # `scripts/*.sh` だけを変更しても shellcheck が一度も走らなかった。
            # その結果、`postdeploy.sh` の素の `python` 呼び出し（`python` を
            # PATH に置かない Linux で command not found になる）が CI を
            # すり抜けていた（P1-14 で実測して発覚）。
            shell:
              - 'scripts/**'
              - 'containers/**'
              - '.github/workflows/ci.yml'
            # OWL 推論器（ELK）による論理的整合性の検査。**`samples/**` を含める。**
            # 新しいサンプルオントロジーを足したときに、それが論理的に矛盾して
            # いないかを検査させるため（P2B-01、ADR-0021）。
            reasoner:
              - 'containers/reasoner/**'
              - 'scripts/check-reasoning.sh'
              - 'samples/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ontology
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存関係を入れる
        run: uv sync --all-packages

      - name: lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: 型検査
        run: uv run mypy packages

      # test_blob.py が使う Azurite(Blob エミュレータ)。`jobs.*.services` は
      # postgres と違って起動コマンドを上書きできない(`command`/`args` に相当する
      # フィールドが無く、`options` は `docker create` の OPTIONS 部分にしか差し込めない)。
      # 既定コマンドのままだと `--blobHost 0.0.0.0` は効くが `--skipApiVersionCheck` が
      # 無いため、SDK が送る x-ms-version を Azurite が拒否して
      # `HttpResponseError: The API version ... is not supported by Azurite` になる
      # (ローカルで実測確認済み)。そのためステップとして直接 `docker run` し、
      # `docker-compose.yml` の azurite サービスと同じ起動コマンドを渡す。
      - name: Azurite(Blob エミュレータ)を起動する
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do
            if docker logs azurite 2>&1 | grep -q "successfully listen"; then
              exit 0
            fi
            sleep 1
          done
          echo "Azurite が起動しませんでした" >&2
          docker logs azurite
          exit 1

      # test_isolation.py が実物の Fuseki を使う(Task 7)。Fuseki は Azurite と違って
      # 公開イメージが無く、このリポジトリの containers/fuseki/Dockerfile からビルドする
      # 必要があるため、Azurite のように `docker run <公開イメージ>` では済まない。
      # `docker-compose.yml` にビルド・ヘルスチェックの定義が既にあるので、ここで
      # 二重管理せずそのまま使う。`fuseki` を明示するので postgres(jobs.*.services で
      # 別途起動済み)や azurite(前のステップで起動済み)は起動されず、ポートも
      # 衝突しない。`--wait` で `docker-compose.yml` のヘルスチェック
      # (`$/ping` が 200 を返すまで)を待つ。
      - name: Fuseki を起動する
        run: docker compose up -d --build --wait fuseki

      - name: テスト(単体 + integration)
        env:
          POSTGRES_PASSWORD: localdev
          FUSEKI_ADMIN_PASSWORD: localdev
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係を入れる
        run: pnpm install --frozen-lockfile

      - name: 型検査とビルド
        run: pnpm --filter @ontology-accelerator/web build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep をビルドして構文を検証する
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuseki
            context: containers/fuseki
            dockerfile: containers/fuseki/Dockerfile
          - name: api
            context: .
            dockerfile: packages/api/Dockerfile
          - name: mcp
            context: .
            dockerfile: packages/mcp-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Windows 上で書いたシェルスクリプトが Linux で動くことを含めて検証する。
      - name: イメージをビルドする
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # OWL 推論器（ELK）による論理的整合性の検査（P2B-01、ADR-0021）。
  #
  # **矛盾と充足不能クラスと読み込み失敗だけが CI を止める。** ELK は扱えない
  # 公理を無視するので誤検出はしない（見逃しはする）。逆に「結論が不完全
  # だった」ことで止める設計にすると、データプロパティを 1 つ持つだけで
  # 実用的なオントロジーが全部落ちる（同梱サンプルで実測）。止めない代わりに、
  # 不完全だったことは必ずログに出す。
  #
  # `containers` ジョブのマトリクスに入れていないのは、下の 2 ステップが
  # イメージをビルドするため二重になるからである。
  reasoner:
    needs: changes
    if: needs.changes.outputs.reasoner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 検査結果の JSON の判定に uv（ontology_core.console）を使う。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 依存関係を入れる
        run: uv sync --all-packages
      # 「矛盾を検出したら止める」「読めなかったら止める」「結論が不完全でも
      # 止めない」の 3 方向を固定する。**片方向だけだと、常に通す実装と常に
      # 止める実装のどちらも通ってしまう。**
      - name: 推論器の検査の振る舞いをテストする
        run: sh containers/reasoner/reasoner-check.test.sh
      # 同梱サンプルを全部検査する。**テストが見ているのは retail-core だけ**
      # なので、サンプルが増えたときにここで捕まえる。
      - name: 同梱サンプルを検査する
        run: sh scripts/check-reasoning.sh samples

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **バージョンを固定した docker イメージを使う。** ubuntu-latest に apt で
      # 入る shellcheck は 0.9.0 で、ローカルで使っていた 0.11.0 と指摘が違う
      # （0.9.0 だけが SC2015 を出した）。**ローカルの検査が CI より緩い**状態は、
      # 「1 つの経路で確認して両方に一般化する」失敗そのものなので、
      # 同じイメージ・同じバージョンを両方で使う。
      # CLAUDE.md の検証コマンドにも同じ 1 行が載っている。
      - name: シェルスクリプトを検査する
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            scripts/*.sh containers/fuseki/*.sh containers/fuseki/lib/*.sh \
            containers/reasoner/*.sh
      # 静的解析では拾えない移植性の検査（素の `python` 呼び出しなど）。
      # 詳細は scripts/lint-shell.sh の冒頭コメント。
      - name: シェルスクリプトの移植性を検査する
        run: sh scripts/lint-shell.sh
      # 名前空間名・バージョン文字列の検証関数(validate_namespace /
      # validate_version_file)に対するテスト。load-snapshot.sh 本体は Blob 一覧
      # の取得や TDB2 の構築など副作用のあるコードを含むため source してテスト
      # できない。検証関数だけを lib/validate.sh に切り出してあるので、ここでは
      # それだけを直接 sh で実行してテストする(Task 7 レビュー修正1)。
      - name: 検証関数のテストを実行する
        run: sh containers/fuseki/lib/validate.test.sh
      # ローダ本体の制御フロー(マニフェストが取得できない・不正な名前空間を
      # スキップし、他の名前空間の読み込みは継続する)に対するテスト(P1-21)。
      # curl と tdb2.tdbloader をスタブに差し替えてスクリプトを丸ごと実行する。
      # jq は ubuntu-latest に標準で入っている。
      - name: ローダの制御フローのテストを実行する
        run: sh containers/fuseki/load-snapshot.test.sh
      # **uv はここから下だけが必要。** preprovision.test.sh は
      # check-platform-admin.py（ontology_core を import する）を本物として
      # 実行する。トークンの解釈こそが検証したい対象なので、そこはスタブに
      # しない（P2A-09）。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 依存関係を入れる
        run: uv sync --all-packages
      # provision を止めるかどうかの分岐に対するテスト（P2A-09）。
      # **止めるべきときに通すと約 11 分と課金を捨て、通すべきときに止めると
      # 確認の仕組み自体が新しいブロッカーになる。** 両方向を固定する。
      - name: preprovision のゲートのテストを実行する
        run: sh scripts/preprovision.test.sh
