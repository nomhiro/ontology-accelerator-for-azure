name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更されたパスに応じて後続のジョブを絞る。
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'azure.yaml'
              - '.github/workflows/ci.yml'
            containers:
              - 'containers/**'
              - 'packages/*/Dockerfile'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存関係を入れる
        run: uv sync --all-packages

      - name: lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: 型検査
        run: uv run mypy packages

      - name: テスト
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係を入れる
        run: pnpm install --frozen-lockfile

      - name: 型検査とビルド
        run: pnpm --filter @ontology-accelerator/web build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep をビルドして構文を検証する
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuseki
            context: containers/fuseki
            dockerfile: containers/fuseki/Dockerfile
          - name: api
            context: .
            dockerfile: packages/api/Dockerfile
          - name: mcp
            context: .
            dockerfile: packages/mcp-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Windows 上で書いたシェルスクリプトが Linux で動くことを含めて検証する。
      - name: イメージをビルドする
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  shell:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: シェルスクリプトを検査する
        run: shellcheck containers/fuseki/*.sh
