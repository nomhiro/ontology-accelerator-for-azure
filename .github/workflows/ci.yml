name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更されたパスに応じて後続のジョブを絞る。
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'azure.yaml'
              - '.github/workflows/ci.yml'
            containers:
              - 'containers/**'
              - 'packages/*/Dockerfile'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ontology
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存関係を入れる
        run: uv sync --all-packages

      - name: lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: 型検査
        run: uv run mypy packages

      # test_blob.py が使う Azurite(Blob エミュレータ)。`jobs.*.services` は
      # postgres と違って起動コマンドを上書きできない(`command`/`args` に相当する
      # フィールドが無く、`options` は `docker create` の OPTIONS 部分にしか差し込めない)。
      # 既定コマンドのままだと `--blobHost 0.0.0.0` は効くが `--skipApiVersionCheck` が
      # 無いため、SDK が送る x-ms-version を Azurite が拒否して
      # `HttpResponseError: The API version ... is not supported by Azurite` になる
      # (ローカルで実測確認済み)。そのためステップとして直接 `docker run` し、
      # `docker-compose.yml` の azurite サービスと同じ起動コマンドを渡す。
      - name: Azurite(Blob エミュレータ)を起動する
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 30); do
            if docker logs azurite 2>&1 | grep -q "successfully listen"; then
              exit 0
            fi
            sleep 1
          done
          echo "Azurite が起動しませんでした" >&2
          docker logs azurite
          exit 1

      - name: テスト(単体 + integration)
        env:
          POSTGRES_PASSWORD: localdev
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係を入れる
        run: pnpm install --frozen-lockfile

      - name: 型検査とビルド
        run: pnpm --filter @ontology-accelerator/web build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep をビルドして構文を検証する
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuseki
            context: containers/fuseki
            dockerfile: containers/fuseki/Dockerfile
          - name: api
            context: .
            dockerfile: packages/api/Dockerfile
          - name: mcp
            context: .
            dockerfile: packages/mcp-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Windows 上で書いたシェルスクリプトが Linux で動くことを含めて検証する。
      - name: イメージをビルドする
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  shell:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: シェルスクリプトを検査する
        run: shellcheck containers/fuseki/*.sh
