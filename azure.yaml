# Azure Developer CLI テンプレート定義。
# `azd up` を唯一のデプロイ手段とし、`azd down` で完全削除できることを保証する。
# スキーマ: https://aka.ms/azure.yaml.json
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ontology-accelerator-for-azure

metadata:
  template: ontology-accelerator-for-azure@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  # Core API (FastAPI)。Control Plane + Data Layer + Context Manager。
  # Fuseki への書き込み (SPARQL Update / Graph Store Protocol) を行える唯一のサービス。
  api:
    project: packages/api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      # uv workspace が packages/core をパス依存で参照するため、リポジトリルートを
      # ビルドコンテキストにする (packages/api だけでは core を COPY できない)。
      # .github/workflows/ci.yml の `context: .` と同じ前提。
      context: ../../

  # MCP Server (Python MCP SDK / Streamable HTTP)。読み取り専用ツールのみ公開する。
  mcp:
    project: packages/mcp-server
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../../

  # Apache Jena Fuseki。initContainer が Blob の正本から TDB2 を起動時に再構築する。
  # containers/fuseki 内で自己完結するため context の指定は不要。
  fuseki:
    project: containers/fuseki
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile

  # Web フロントエンド (React + Vite + Fluent UI)。
  web:
    project: apps/web
    language: js
    host: staticwebapp
    dist: dist

hooks:
  # サンプルオントロジー (samples/retail-core.ttl) を **Core API 経由で** 投入する。
  #
  # **postprovision ではなく postdeploy である理由**: azd のフックは
  # provision → postprovision → deploy → postdeploy の順に走る。postprovision の
  # 時点ではコンテナアプリのイメージがまだプレースホルダで **Core API が起動して
  # いない**。API 経由で投入するには deploy の後でなければならない。
  #
  # **API 経由である理由** (P1-10): 以前は Blob へ直接書いていたため PostgreSQL に
  # 行が入らず、`GET /namespaces` と MCP の `list_namespaces` が空配列を返して
  # **デプロイしたサンプルがエージェント経路から発見できなかった**。書き込み順序
  # Blob → PostgreSQL → Fuseki (不変条件2) の 2 段目が飛んでいた。API 経由なら
  # API が Blob・PostgreSQL・マニフェスト・Fuseki を正しい順序で書く。
  #
  # continueOnError は **false** にしている。ここが失敗すると Phase 1 の完了条件
  # (エージェントが MCP 経由でサンプルを発見できる) が満たされないため、
  # 黙って成功扱いにしてはいけない。スクリプト自身が最後に一覧を引いて
  # 発見できることを確認する。
  postdeploy:
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: ./scripts/postdeploy.sh
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: ./scripts/postdeploy.ps1
